<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八王子食品 貢献利益率シミュレーター</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (JSXをブラウザで変換) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const App = () => {
      // 基準値の定義
      const TOTAL_SALES = 55.0; // 億円
      const SALES = {
        existing: 44.0, // 80%
        pro: 8.25,      // 15%
        coop: 2.75      // 5%
      };
      const DEFAULTS = {
        existing: 35.5,
        pro: 48.0,
        coop: 48.0
      };

      // 状態管理（スライダーと連動）
      const [margins, setMargins] = useState(DEFAULTS);

      // 数値計算ロジック
      const calcProfit = (sales, margin) => sales * (margin / 100);
      
      const defaultProfits = {
        existing: calcProfit(SALES.existing, DEFAULTS.existing),
        pro: calcProfit(SALES.pro, DEFAULTS.pro),
        coop: calcProfit(SALES.coop, DEFAULTS.coop)
      };
      const defaultTotalProfit = defaultProfits.existing + defaultProfits.pro + defaultProfits.coop;
      const defaultTotalMargin = (defaultTotalProfit / TOTAL_SALES) * 100;

      const currentProfits = {
        existing: calcProfit(SALES.existing, margins.existing),
        pro: calcProfit(SALES.pro, margins.pro),
        coop: calcProfit(SALES.coop, margins.coop)
      };
      const currentTotalProfit = currentProfits.existing + currentProfits.pro + currentProfits.coop;
      const currentTotalMargin = (currentTotalProfit / TOTAL_SALES) * 100;

      // 差分表示用のフォーマット関数
      const formatDiff = (current, defaultVal, unit) => {
        const diff = current - defaultVal;
        if (Math.abs(diff) < 0.01) return <span class="text-gray-500">±0.0 {unit}</span>;
        const sign = diff > 0 ? '+' : '';
        const color = diff > 0 ? 'text-green-600' : 'text-red-600';
        return <span class={`font-bold ${color}`}>{sign}{diff.toFixed(1)} {unit}</span>;
      };

      const handleReset = () => setMargins(DEFAULTS);

      return (
        <div class="max-w-5xl mx-auto p-4 md:p-8">
          <header class="mb-8 flex justify-between items-end border-b pb-4 border-gray-300">
            <div>
              <h1 class="text-3xl font-bold text-gray-900">八王子食品 貢献利益率シミュレーター</h1>
              <p class="text-gray-600 mt-2">チャネルごとの利益率変動が、全社利益に与えるインパクトを検証します。</p>
            </div>
            <button onClick={handleReset} class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded shadow-sm transition">
              🔄 全体リセット
            </button>
          </header>

          {/* 経営幹部向け解説パネル */}
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-xl font-bold text-blue-800 mb-4 flex items-center">
              <span class="mr-2">💡</span> 経営幹部向け：管理会計の基礎と計算ロジック
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="bg-blue-50 p-4 rounded-md">
                <h3 class="font-bold text-gray-700 mb-2 border-b border-blue-200 pb-1">貢献利益の定義と必須公式</h3>
                <p class="text-sm text-gray-600 mb-3">貢献利益は、固定費を回収し営業利益を生み出す「源泉」です。</p>
                <ul class="space-y-2 font-mono text-sm bg-white p-3 rounded border border-blue-100">
                  <li>① <span class="font-bold">貢献利益</span> ＝ 売上高 － 変動費</li>
                  <li>② <span class="font-bold">貢献利益</span> ＝ 売上高 × 貢献利益率</li>
                  <li>③ <span class="font-bold">貢献利益率</span> ＝ 貢献利益 ÷ 売上高</li>
                </ul>
              </div>
              <div class="flex items-center">
                <div class="w-full bg-gradient-to-r from-yellow-50 to-white border-l-4 border-yellow-400 p-5 rounded-r shadow-sm">
                  <p class="text-lg font-bold text-gray-800 leading-relaxed">
                    貢献利益（額）を増やすためには、<br/>
                    <span class="text-yellow-700 underline decoration-yellow-400 decoration-4">貢献利益率を向上させること</span> が不可欠です。
                  </p>
                </div>
              </div>
            </div>
            <div class="mt-4 text-sm text-gray-500 text-center bg-gray-50 p-2 rounded">
              【全社の積み上げ】 全社貢献利益(額) ＝ 既存事業 ＋ 業務用 ＋ 生協・通販 の合計
            </div>
          </div>

          {/* 全社業績サマリー */}
          <div class="bg-gradient-to-br from-indigo-900 to-blue-900 rounded-xl shadow-lg p-6 mb-8 text-white">
            <h2 class="text-xl font-bold mb-6 border-b border-indigo-400/50 pb-2">全社業績サマリー</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
              <div class="bg-white/10 rounded-lg p-4">
                <p class="text-indigo-200 text-sm mb-1">全社売上高 (固定)</p>
                <p class="text-3xl font-bold">{TOTAL_SALES.toFixed(1)} 億円</p>
              </div>
              <div class="bg-white/10 rounded-lg p-4">
                <p class="text-indigo-200 text-sm mb-1">全社貢献利益率</p>
                <div class="flex items-end justify-center gap-3">
                  <p class="text-4xl font-bold text-yellow-400">{currentTotalMargin.toFixed(1)}%</p>
                  <div class="mb-1 bg-white/20 px-2 py-1 rounded text-sm">
                    {formatDiff(currentTotalMargin, defaultTotalMargin, 'pt')}
                  </div>
                </div>
                <p class="text-xs text-indigo-200 mt-2">デフォルト: {defaultTotalMargin.toFixed(1)}%</p>
              </div>
              <div class="bg-white/10 rounded-lg p-4">
                <p class="text-indigo-200 text-sm mb-1">全社貢献利益額</p>
                <div class="flex items-end justify-center gap-3">
                  <p class="text-4xl font-bold text-yellow-400">{currentTotalProfit.toFixed(2)}</p>
                  <p class="text-xl mb-1">億円</p>
                </div>
                <div class="mt-2 bg-white/20 inline-block px-3 py-1 rounded text-sm">
                  {formatDiff(currentTotalProfit, defaultTotalProfit, '億円')}
                </div>
              </div>
            </div>
          </div>

          {/* 操作ガイド */}
          <div class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 rounded mb-6 flex items-center shadow-sm">
            <span class="text-xl mr-3">👆</span>
            <p class="font-medium">
              スライダーを動かすか、数値を直接入力してください。利益率の絶対値を変更すると、各チャネルの貢献利益額と全社の利益が瞬時に再計算されます。
            </p>
          </div>

          {/* チャネル別設定カード */}
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            {/* 既存事業 */}
            <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
              <div class="bg-gray-100 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                <h3 class="font-bold text-lg text-gray-800">既存事業</h3>
                <span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded-full font-bold">売上構成 80%</span>
              </div>
              <div class="p-5 space-y-6">
                <div>
                  <p class="text-sm text-gray-500 mb-1">チャネル売上高</p>
                  <p class="text-xl font-bold">{SALES.existing.toFixed(2)} 億円</p>
                </div>
                
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                  <label class="block text-sm font-bold text-gray-700 mb-2">貢献利益率を設定</label>
                  <div class="flex items-center gap-4 mb-2">
                    <input type="range" min="20" max="60" step="0.1"
                      class="w-full accent-blue-600"
                      value={margins.existing}
                      onChange={(e) => setMargins({...margins, existing: parseFloat(e.target.value)})}
                    />
                    <div class="flex items-center gap-1">
                      <input type="number" min="20" max="60" step="0.1"
                        class="w-20 p-1 border border-gray-300 rounded text-right font-bold text-blue-700"
                        value={margins.existing}
                        onChange={(e) => setMargins({...margins, existing: parseFloat(e.target.value) || 0})}
                      />
                      <span class="font-bold text-gray-600">%</span>
                    </div>
                  </div>
                  <div class="text-right text-sm">
                    {formatDiff(margins.existing, DEFAULTS.existing, 'pt')}
                  </div>
                </div>

                <div class="pt-4 border-t border-gray-100">
                  <p class="text-sm text-gray-500 mb-1">貢献利益額</p>
                  <div class="flex justify-between items-end">
                    <p class="text-3xl font-bold text-gray-800">{currentProfits.existing.toFixed(2)} <span class="text-base font-normal">億円</span></p>
                    <div class="text-right bg-gray-50 p-1 px-2 rounded border">
                      {formatDiff(currentProfits.existing, defaultProfits.existing, '億円')}
                    </div>
                  </div>
                  <p class="text-xs text-gray-400 mt-2 text-right">デフォルト: {defaultProfits.existing.toFixed(2)}億円</p>
                </div>
              </div>
            </div>

            {/* 業務用 */}
            <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
              <div class="bg-green-50 px-4 py-3 border-b border-green-100 flex justify-between items-center">
                <h3 class="font-bold text-lg text-green-900">業務用</h3>
                <span class="text-xs bg-green-200 text-green-800 px-2 py-1 rounded-full font-bold">売上構成 15%</span>
              </div>
              <div class="p-5 space-y-6">
                <div>
                  <p class="text-sm text-gray-500 mb-1">チャネル売上高</p>
                  <p class="text-xl font-bold">{SALES.pro.toFixed(2)} 億円</p>
                </div>
                
                <div class="bg-green-50/50 p-4 rounded-lg border border-green-100">
                  <label class="block text-sm font-bold text-gray-700 mb-2">貢献利益率を設定</label>
                  <div class="flex items-center gap-4 mb-2">
                    <input type="range" min="30" max="70" step="0.1"
                      class="w-full accent-green-600"
                      value={margins.pro}
                      onChange={(e) => setMargins({...margins, pro: parseFloat(e.target.value)})}
                    />
                    <div class="flex items-center gap-1">
                      <input type="number" min="30" max="70" step="0.1"
                        class="w-20 p-1 border border-gray-300 rounded text-right font-bold text-green-700"
                        value={margins.pro}
                        onChange={(e) => setMargins({...margins, pro: parseFloat(e.target.value) || 0})}
                      />
                      <span class="font-bold text-gray-600">%</span>
                    </div>
                  </div>
                  <div class="text-right text-sm">
                    {formatDiff(margins.pro, DEFAULTS.pro, 'pt')}
                  </div>
                </div>

                <div class="pt-4 border-t border-gray-100">
                  <p class="text-sm text-gray-500 mb-1">貢献利益額</p>
                  <div class="flex justify-between items-end">
                    <p class="text-3xl font-bold text-gray-800">{currentProfits.pro.toFixed(2)} <span class="text-base font-normal">億円</span></p>
                    <div class="text-right bg-gray-50 p-1 px-2 rounded border">
                      {formatDiff(currentProfits.pro, defaultProfits.pro, '億円')}
                    </div>
                  </div>
                  <p class="text-xs text-gray-400 mt-2 text-right">デフォルト: {defaultProfits.pro.toFixed(2)}億円</p>
                </div>
              </div>
            </div>

            {/* 生協・通販 */}
            <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
              <div class="bg-orange-50 px-4 py-3 border-b border-orange-100 flex justify-between items-center">
                <h3 class="font-bold text-lg text-orange-900">生協・通販</h3>
                <span class="text-xs bg-orange-200 text-orange-800 px-2 py-1 rounded-full font-bold">売上構成 5%</span>
              </div>
              <div class="p-5 space-y-6">
                <div>
                  <p class="text-sm text-gray-500 mb-1">チャネル売上高</p>
                  <p class="text-xl font-bold">{SALES.coop.toFixed(2)} 億円</p>
                </div>
                
                <div class="bg-orange-50/50 p-4 rounded-lg border border-orange-100">
                  <label class="block text-sm font-bold text-gray-700 mb-2">貢献利益率を設定</label>
                  <div class="flex items-center gap-4 mb-2">
                    <input type="range" min="30" max="70" step="0.1"
                      class="w-full accent-orange-500"
                      value={margins.coop}
                      onChange={(e) => setMargins({...margins, coop: parseFloat(e.target.value)})}
                    />
                    <div class="flex items-center gap-1">
                      <input type="number" min="30" max="70" step="0.1"
                        class="w-20 p-1 border border-gray-300 rounded text-right font-bold text-orange-600"
                        value={margins.coop}
                        onChange={(e) => setMargins({...margins, coop: parseFloat(e.target.value) || 0})}
                      />
                      <span class="font-bold text-gray-600">%</span>
                    </div>
                  </div>
                  <div class="text-right text-sm">
                    {formatDiff(margins.coop, DEFAULTS.coop, 'pt')}
                  </div>
                </div>

                <div class="pt-4 border-t border-gray-100">
                  <p class="text-sm text-gray-500 mb-1">貢献利益額</p>
                  <div class="flex justify-between items-end">
                    <p class="text-3xl font-bold text-gray-800">{currentProfits.coop.toFixed(2)} <span class="text-base font-normal">億円</span></p>
                    <div class="text-right bg-gray-50 p-1 px-2 rounded border">
                      {formatDiff(currentProfits.coop, defaultProfits.coop, '億円')}
                    </div>
                  </div>
                  <p class="text-xs text-gray-400 mt-2 text-right">デフォルト: {defaultProfits.coop.toFixed(2)}億円</p>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
